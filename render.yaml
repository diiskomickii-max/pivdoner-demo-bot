services:
  - type: web
    name: pivdoner-demo-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MANAGER_CHAT_ID
        sync: false
      - key: DEMO_MODE
        value: "1"
      - key: SELLER_CONTACT
        value: "@xxlkkl"
      - key: PAYMENT_ENABLED
        value: "1"
